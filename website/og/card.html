<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Fonts and palette are the site's own: see src/fonts.css and src/index.css. */
      @font-face {
        font-family: "Hanken Grotesk";
        font-weight: 400 700;
        src: url("../public/fonts/hanken-grotesk-variable.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 56px 64px;
        font-family: "Hanken Grotesk", sans-serif;
        color: #1b1a21;
        /* The Soft Light desk: one flat neutral, no texture. */
        background-color: #ecebf1;
        -webkit-font-smoothing: antialiased;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 9px;
      }

      h1 {
        margin-top: 104px;
        font-size: 104px;
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .bracket {
        color: rgb(27 26 33 / 0.28);
        font-weight: 400;
      }

      .link {
        color: #5b4ad0;
        text-decoration: underline dashed 3px rgb(91 74 208 / 0.55);
        text-underline-offset: 12px;
      }

      .sub {
        margin-top: 36px;
        max-width: 22em;
        font-size: 26px;
        line-height: 1.4;
        color: #5d5c69;
      }

      .shot {
        position: absolute;
        top: 72px;
        left: 590px;
        width: 960px;
        border-radius: 14px;
        /* The app's pop shadow: a hairline and one soft drop. */
        box-shadow:
          0 0 0 1px rgb(24 20 48 / 0.08),
          0 16px 48px -12px rgb(24 20 48 / 0.28);
      }
    </style>
  </head>
  <body>
    <img class="shot" src="../public/screenshots/live.webp" alt="" />
    <div class="brand">
      <img src="../public/icon.png" alt="" />
      <span>Marky</span>
    </div>
    <h1>
      Notes<br />that <span class="bracket">[[</span><span class="link">link</span
      ><span class="bracket">]]</span>
    </h1>
    <p class="sub">Markdown in a folder on your own disk.</p>
  </body>
</html>
