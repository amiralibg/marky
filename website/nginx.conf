server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Security headers live in an include because nginx drops inherited
    # add_header directives in any block that declares one of its own, and most
    # of the locations below declare a Cache-Control. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    location = /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # `/` reaches index.html through the try_files fallback below, which is an
    # internal redirect and so re-enters location matching here. Without the
    # include, the main document — the one page that actually needs the CSP and
    # frame-ancestors — would go out with no security headers at all.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # The changelog's build-time snapshot. Rebuilt on every deploy and only a
    # head start on the GitHub API, so it must not outlive a release by much.
    location = /releases.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    # .webmanifest is not in nginx's default mime.types, so without this it goes
    # out as application/octet-stream and browsers ignore it.
    location = /site.webmanifest {
        include /etc/nginx/security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400";
    }

    # Social cards are fetched by unfurlers that cache hard on their side; a day
    # is long enough here and lets a regenerated card propagate.
    location = /og.png {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Requested by crawlers and feed readers that never parse the <link> tags.
    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Font filenames are stable rather than hashed, so cache hard but revalidate
    # in a year rather than claiming immutability.
    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000";
        types { font/woff2 woff2; }
    }

    location ~* \.(png|jpe?g|svg|ico|webp)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # The feedback board's API. Same origin, so no CORS preflights in
    # production; the api container is on this compose network.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
