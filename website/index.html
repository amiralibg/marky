<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Marky — Offline-first Markdown notes</title>
    <meta
      name="description"
      content="Marky is an offline-first Markdown notes app with local folders, wiki links, graph navigation, and a polished desktop editor. Download for macOS, Windows, and Linux."
    />
    <meta property="og:title" content="Marky — Offline-first Markdown notes" />
    <meta
      property="og:description"
      content="Local folders. Wiki links. Graph navigation. Download for macOS, Windows, and Linux — ARM64 and AMD64."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("marky-site-theme");
          const theme = stored === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#1e1e1c" : "#f3efe6");
        } catch {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
