# Included at server level and again in every location that sets an add_header
# of its own. nginx only inherits add_header directives when the child level
# defines none at all, so a location that sets Cache-Control silently drops
# every security header above it — including the one serving index.html.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# The site asks for none of these, so hand them all back.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
# Self-contained static site: no third-party scripts, styles, or fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
