name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create from this commit, for example v0.0.2"
        required: true
        default: "v__VERSION__"
      release_body:
        description: "Custom release notes. If empty, .github/release-notes/<tag>.md is used when present."
        required: false
        default: ""
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_body: ${{ steps.metadata.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        env:
          RELEASE_BODY_INPUT: ${{ inputs.release_body }}
        run: |
          tag_name="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          prerelease="${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}"
          body_file="$(mktemp)"

          if [ -n "$RELEASE_BODY_INPUT" ]; then
            printf '%s\n' "$RELEASE_BODY_INPUT" > "$body_file"
          elif [ -f ".github/release-notes/${tag_name}.md" ]; then
            cp ".github/release-notes/${tag_name}.md" "$body_file"
          else
            printf 'Automated Marky desktop release.\n\nBuilt from commit ${{ github.sha }}.\n' > "$body_file"
          fi

          {
            echo "tag_name=$tag_name"
            echo "prerelease=$prerelease"
            echo "release_body<<EOF"
            cat "$body_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.label }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            label: macOS x64
            args: ""
          - platform: macos-15
            label: macOS arm64
            args: ""
          - platform: ubuntu-22.04
            label: Linux x64
            args: ""
          - platform: ubuntu-22.04-arm
            label: Linux arm64
            args: ""
          - platform: windows-2022
            label: Windows x64
            args: ""
          - platform: windows-11-arm
            label: Windows arm64
            args: ""

    runs-on: ${{ matrix.platform }}
    # A build takes ~20 minutes. Without this the job inherits the six-hour
    # default, which is how a hung apt-get once sat there for two hours before
    # anyone noticed.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        # The Acquire options are the point of this step's shape: with no
        # timeout apt blocks indefinitely on an unreachable mirror rather than
        # falling back to the next one, and azure.archive.ubuntu.com does go
        # dark on these runners. Fail in minutes and let the job be re-run.
        #
        # They belong on `install` as much as on `update`, which is what sank
        # the v1.7.0 Linux x64 build: `update` finished fine, then `install`
        # stalled partway through libwebkit2gtk-4.1-0 (27 MB) and sat there
        # until the step timeout, so that release shipped with no x86_64 deb,
        # rpm or AppImage at all. An unadorned `install` has no timeout to hit.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          # Retries here are per-file, so a mirror that dies mid-download costs
          # seconds rather than the whole job.
          APT_OPTS: >-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
        run: |
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      # A tag can be pushed straight to a branch that CI never gated, so the
      # suite runs here too rather than trusting that a pull request caught it.
      - name: Test frontend
        run: pnpm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-metadata.outputs.tag_name }}
          releaseName: "Marky ${{ needs.release-metadata.outputs.tag_name }}"
          releaseBody: ${{ needs.release-metadata.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  verify-updater:
    name: Verify updater manifest
    needs: [release-metadata, release]
    # Runs whatever the builds did: a red build already says *something* broke,
    # but not that the release shipped binaries the updater cannot see.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each build job merges its own platform into one shared `latest.json` on
      # the release. A job that dies after uploading its binaries but before
      # that merge — v1.8.0's macOS arm64 job hit a GitHub API 404 on its last
      # upload — leaves the release complete and the manifest a platform short.
      # Nothing downstream notices: the updater looks up a key that is not
      # there and tells those users they are up to date.
      - name: Check every platform is in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-metadata.outputs.tag_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # The keys the updater resolves: `{os}-{arch}`, one per build.
          EXPECTED="darwin-aarch64 darwin-x86_64 linux-aarch64 linux-x86_64 windows-aarch64 windows-x86_64"

          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir . --clobber
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort > assets.txt

          missing=""
          unsigned=""
          dangling=""

          for key in $EXPECTED; do
            entry="$(jq -c --arg k "$key" '.platforms[$k] // empty' latest.json)"
            if [ -z "$entry" ]; then
              missing="$missing $key"
              continue
            fi

            [ -n "$(printf '%s' "$entry" | jq -r '.signature // ""')" ] || unsigned="$unsigned $key"

            # Compared against the release's asset list rather than downloaded,
            # so one flaky transfer cannot fail an otherwise sound release.
            file="$(printf '%s' "$entry" | jq -r '.url // ""' | sed 's#.*/##')"
            grep -qxF "$file" assets.txt || dangling="$dangling $key($file)"
          done

          if [ -n "$missing$unsigned$dangling" ]; then
            echo "::error::latest.json is incomplete — the app will report \"up to date\" on the platforms below."
            [ -n "$missing" ] && echo "  missing from the manifest:$missing"
            [ -n "$unsigned" ] && echo "  present but unsigned:$unsigned"
            [ -n "$dangling" ] && echo "  pointing at an asset that is not on the release:$dangling"
            echo
            echo "The binaries are usually already uploaded; re-running the failed"
            echo "build restores its entry without a new tag:"
            echo "  gh run rerun $RUN_ID --failed"
            exit 1
          fi

          echo "latest.json covers all six platforms, each signed and pointing at an asset on the release."
