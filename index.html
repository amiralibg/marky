<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecebf1" />
    <title>Marky - Beautiful Markdown Notes</title>
    <script>
      (() => {
        // Keep in sync with src/store/settingsStore.js THEMES / ACCENT_COLORS
        const themes = {
          vault: {
            type: "light",
            bgBase: "#fdfdfc",
            bgSidebar: "#ecebf1",
            bgEditor: "#fdfdfc",
            textPrimary: "#1b1a21",
            textSecondary: "#5d5c69",
            textMuted: "#9795a2",
            border: "rgba(24, 20, 48, 0.08)",
          },
          "vault-dark": {
            type: "dark",
            bgBase: "#1b1a20",
            bgSidebar: "#131217",
            bgEditor: "#1b1a20",
            textPrimary: "#edecf3",
            textSecondary: "#a5a3b1",
            textMuted: "#6d6b79",
            border: "rgba(236, 232, 255, 0.08)",
          },
          black: {
            type: "dark",
            bgBase: "#000000",
            bgSidebar: "#000000",
            bgEditor: "#000000",
            textPrimary: "#f2f2f4",
            textSecondary: "#a1a1a8",
            textMuted: "#6b6b72",
            border: "rgba(255, 255, 255, 0.10)",
            // Desk and sheet are both black: the skeleton sheet needs the
            // theme's strong ring (its `sheetRing` override) to show at all.
            sheetRing: "rgba(255, 255, 255, 0.17)",
          },
          paper: {
            type: "light",
            bgBase: "#f6f3ec",
            bgSidebar: "#efeae0",
            bgEditor: "#fffefb",
            textPrimary: "#38352f",
            textSecondary: "#75716a",
            textMuted: "#a39d92",
            border: "rgba(55, 50, 40, 0.11)",
          },
          "paper-dark": {
            type: "dark",
            bgBase: "#1c1a16",
            bgSidebar: "#191713",
            bgEditor: "#242019",
            textPrimary: "#ece5d6",
            textSecondary: "#a8a092",
            textMuted: "#756d5f",
            border: "rgba(240, 232, 214, 0.10)",
          },
          slate: {
            type: "dark",
            bgBase: "#0e131c",
            bgSidebar: "#121a26",
            bgEditor: "#16202e",
            textPrimary: "#e6ecf5",
            textSecondary: "#8ea0b8",
            textMuted: "#5d6e85",
            border: "rgba(255, 255, 255, 0.08)",
          },
          "gruvbox-light": {
            type: "light",
            bgBase: "#f2e5bc",
            bgSidebar: "#ebdbb2",
            bgEditor: "#fbf1c7",
            textPrimary: "#3c3836",
            textSecondary: "#665c54",
            textMuted: "#928374",
            border: "rgba(60, 56, 54, 0.12)",
          },
          "gruvbox-dark": {
            type: "dark",
            bgBase: "#282828",
            bgSidebar: "#1d2021",
            bgEditor: "#32302f",
            textPrimary: "#ebdbb2",
            textSecondary: "#a89984",
            textMuted: "#7c6f64",
            border: "rgba(235, 219, 178, 0.10)",
          },
          "dark-matter-mars": {
            type: "dark",
            bgBase: "#0b0b0b",
            bgSidebar: "#101010",
            bgEditor: "#141414",
            textPrimary: "#d4d4d4",
            textSecondary: "#9a9a9a",
            textMuted: "#6b6b6b",
            border: "rgba(255, 255, 255, 0.075)",
          },
          "dark-matter-neptune": {
            type: "dark",
            bgBase: "#131421",
            bgSidebar: "#16161e",
            bgEditor: "#1a1b26",
            textPrimary: "#d5d8e5",
            textSecondary: "#9fa3bd",
            textMuted: "#6b7089",
            border: "rgba(230, 235, 255, 0.08)",
          },
          "catppuccin-mocha": {
            type: "dark",
            bgBase: "#181825",
            bgSidebar: "#11111b",
            bgEditor: "#1e1e2e",
            textPrimary: "#cdd6f4",
            textSecondary: "#a6adc8",
            textMuted: "#6c7086",
            border: "rgba(205, 214, 244, 0.09)",
          },
          "catppuccin-latte": {
            type: "light",
            bgBase: "#e6e9ef",
            bgSidebar: "#dce0e8",
            bgEditor: "#eff1f5",
            textPrimary: "#4c4f69",
            textSecondary: "#6c6f85",
            textMuted: "#8c8fa1",
            border: "rgba(76, 79, 105, 0.11)",
          },
          nord: {
            type: "dark",
            bgBase: "#272c36",
            bgSidebar: "#2b303b",
            bgEditor: "#2e3440",
            textPrimary: "#e5e9f0",
            textSecondary: "#9aa3b4",
            textMuted: "#6e7789",
            border: "rgba(216, 222, 233, 0.09)",
          },
          dracula: {
            type: "dark",
            bgBase: "#1e1f29",
            bgSidebar: "#191a21",
            bgEditor: "#282a36",
            textPrimary: "#f8f8f2",
            textSecondary: "#babdcc",
            textMuted: "#6272a4",
            border: "rgba(248, 248, 242, 0.09)",
          },
          "rose-pine": {
            type: "dark",
            bgBase: "#191724",
            bgSidebar: "#15131f",
            bgEditor: "#1f1d2e",
            textPrimary: "#e0def4",
            textSecondary: "#908caa",
            textMuted: "#6e6a86",
            border: "rgba(224, 222, 244, 0.09)",
          },
          "rose-pine-dawn": {
            type: "light",
            bgBase: "#faf4ed",
            bgSidebar: "#f2e9e1",
            bgEditor: "#fffaf3",
            textPrimary: "#575279",
            textSecondary: "#797593",
            textMuted: "#9893a5",
            border: "rgba(87, 82, 121, 0.11)",
          },
        };

        const themeAlias = {
          light: "vault",
          charcoal: "vault-dark",
          midnight: "dark-matter-mars",
          "tokyo-night": "dark-matter-neptune",
          "one-dark": "dracula",
        };
        const accentAlias = { violet: "purple", amber: "orange", cyan: "blue" };

        const accents = {
          purple: { value: "#6d5ce0", hover: "#5b4ad0" },
          blue: { value: "#3b6fd0", hover: "#2f5db8" },
          pink: { value: "#d65b9a", hover: "#c34787" },
          red: { value: "#d35450", hover: "#bf413d" },
          orange: { value: "#d57a32", hover: "#c16a24" },
          green: { value: "#4f9d69", hover: "#3f8a58" },
          lavender: { value: "#a874ff", hover: "#9560f0" },
          teal: { value: "#3fb0b8", hover: "#329aa1" },
          yellow: { value: "#d3a44a", hover: "#c08f36" },
        };

        const normalizePath = (v) => (v ? v.replace(/\\/g, "/") : "");

        try {
          const raw = localStorage.getItem("marky-settings");
          const parsed = raw ? JSON.parse(raw) : null;
          const state = parsed?.state || {};

          // Replicate store's workspace-aware resolution: top-level is already the
          // active snapshot, but fall back to the explicit profile when present so
          // a stale top-level never flashes the wrong vault theme.
          let themeId = state.themeId;
          let accentId = state.accentColorId;
          let translucent = state.translucentWindow;
          let translucency = state.translucencyAmount;
          const active = normalizePath(state.activeWorkspacePath);
          if (active && state.workspaceProfiles && state.workspaceProfiles[active]) {
            const profile = state.workspaceProfiles[active];
            if (profile?.themeId) themeId = profile.themeId;
            if (profile?.accentColorId) accentId = profile.accentColorId;
            if (typeof profile?.translucentWindow === "boolean")
              translucent = profile.translucentWindow;
            if (typeof profile?.translucencyAmount === "number")
              translucency = profile.translucencyAmount;
          } else if (state.sharedSettings) {
            // Fresh install before top-level migrated still has values under sharedSettings
            if (!themeId && state.sharedSettings.themeId) themeId = state.sharedSettings.themeId;
            if (!accentId && state.sharedSettings.accentColorId)
              accentId = state.sharedSettings.accentColorId;
          }

          themeId = themeAlias[themeId] || themeId;
          accentId = accentAlias[accentId] || accentId;
          const theme = themes[themeId] || themes.vault;
          const accent = accents[accentId] || accents.purple;

          const root = document.documentElement;
          root.setAttribute("data-theme", theme.type);
          // CSS variables only — the stylesheet below paints html/body/#root
          // from them. No inline backgrounds: a translucent window needs those
          // three transparent, and an inline style would outrank that.
          root.style.setProperty("--color-bg-base", theme.bgBase);
          root.style.setProperty("--color-bg-sidebar", theme.bgSidebar);
          root.style.setProperty("--color-bg-editor", theme.bgEditor);
          root.style.setProperty("--color-text-primary", theme.textPrimary);
          root.style.setProperty("--color-text-secondary", theme.textSecondary);
          root.style.setProperty("--color-text-muted", theme.textMuted);
          root.style.setProperty("--color-border", theme.border);
          // The skeleton's sheet outline; the soft border for every theme
          // that has no ring of its own.
          root.style.setProperty("--color-sheet-ring", theme.sheetRing || theme.border);
          root.style.setProperty("--color-accent", accent.value);
          root.style.setProperty("--color-accent-hover", accent.hover);
          root.style.setProperty("--color-accent-dim", accent.value + "21");
          root.style.color = theme.textPrimary;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme.bgSidebar);

          // Translucent window — keep in step with src/utils/windowTranslucency.js
          // (macOS and Windows only; off unless the setting says otherwise).
          const ua = navigator.userAgent.toLowerCase();
          const isMac = ua.includes("mac");
          const isWindows = ua.includes("win");
          if (typeof translucent !== "boolean") translucent = false;
          if (translucent && (isMac || isWindows)) root.setAttribute("data-translucent", "");
          // The desk tint for the Translucency amount — keep in step with
          // deskAlphaFor / clampTranslucency in windowTranslucency.js.
          if (typeof translucency !== "number" || !isFinite(translucency)) translucency = 50;
          translucency = Math.min(100, Math.max(0, Math.round(translucency / 5) * 5));
          const floor = theme.type === "dark" ? 32 : 44;
          const alpha = Math.round((100 - (translucency / 100) * (100 - floor)) * 10) / 10;
          root.style.setProperty("--desk-alpha", alpha + "%");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      /* Prevent flash — the Vault light desk, overwritten synchronously by the
         script above. Transparent instead when the window is translucent, so
         the native material is what shows before React mounts. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-bg-sidebar, #ecebf1);
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background: var(--color-bg-sidebar, #ecebf1);
      }
      :root[data-translucent],
      :root[data-translucent] body,
      :root[data-translucent] #root {
        background: transparent;
      }
      /* Skeleton keeps the first frame themed even before React mounts — avoids
         a white/blank rect when the window is already visible (Tauri dev) */
      :root:not([data-translucent]) #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: var(--color-bg-sidebar, #ecebf1);
      }
      #app-skeleton {
        background: var(--color-bg-sidebar, #ecebf1);
      }
      :root[data-translucent] #app-skeleton {
        background: color-mix(
          in srgb,
          var(--color-bg-sidebar, #ecebf1) var(--desk-alpha, 72%),
          transparent
        );
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant skeleton — themed by the script above, visible before React
           mounts. Mirrors App's real layout (48px title bar, 280px sidebar, and
           the sheet floating on the desk with an 8px gap) so nothing shifts
           when React takes over. -->
      <div
        id="app-skeleton"
        style="height: 100vh; display: flex; flex-direction: column; overflow: hidden"
      >
        <div style="height: 48px; flex-shrink: 0"></div>
        <div style="flex: 1; display: flex; min-height: 0">
          <div style="width: 280px; flex-shrink: 0"></div>
          <div
            style="
              flex: 1;
              min-width: 0;
              margin: 0 8px 8px 0;
              border-radius: 14px;
              background: var(--color-bg-editor, #fdfdfc);
              box-shadow: 0 0 0 1px var(--color-sheet-ring, rgba(24, 20, 48, 0.08));
            "
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
