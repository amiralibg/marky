[package]
name = "marky"
version = "1.10.0"
description = "A beautiful markdown note-taking app"
authors = ["you"]
edition = "2021"

[lib]
name = "marky_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves local files to the webview over `asset://`, which is
# how a note's images reach the preview — a webview on `tauri://localhost` can
# fetch nothing from disk without it.
#
# `macos-private-api` is what lets a macOS window be transparent (WKWebView
# stops drawing its own background), which the Translucent window setting
# needs for the vibrancy material to show through.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
# The window materials behind the Translucent window setting (see
# `set_window_translucency`). Already in the tree through Tauri; used directly
# for the Windows 11 Mica → Windows 10 Acrylic fallback, which Tauri's own
# `set_effects` doesn't do (it applies the first effect listed, or nothing).
window-vibrancy = "0.6"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
notify-debouncer-full = "0.3"
# Gitignore-aware directory walking (the crate behind ripgrep). Replaces the
# hand-rolled recursive scan, which skipped only dotfiles — so a workspace that
# happened to be a code repo pulled every README in node_modules into memory.
ignore = "0.4"
tauri-plugin-process = "2.3.1"
# S3 sync signs its requests with SigV4 in JS; plain webview fetch is
# CORS-blocked by buckets without a policy, so requests go through this.
tauri-plugin-http = "2"
# Git sync (see src/git_sync.rs) shells out to the system `git` binary rather
# than linking libgit2 — the vendored libgit2 + OpenSSL stack cost ~3 MB of app
# size for a feature most users never open, while `git` is already present on
# every machine that could use this (macOS and Linux ship it; Windows users who
# sync with git have Git for Windows). The frontend hides the whole section when
# `git_available` finds no binary.

[target.'cfg(target_os = "macos")'.dependencies]
# An empty unified toolbar on every window (see `install_title_toolbar`), so
# AppKit lays out the traffic lights itself. Both crates are already in the
# tree through Tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSToolbar", "NSWindow", "NSResponder"] }

[dev-dependencies]
# Git sync's tests run a real push/pull/merge between throwaway repositories on
# disk; they need somewhere safe to put them.
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
