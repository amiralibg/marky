[package]
name = "marky"
version = "1.7.0"
description = "A beautiful markdown note-taking app"
authors = ["you"]
edition = "2021"

[lib]
name = "marky_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves local files to the webview over `asset://`, which is
# how a note's images reach the preview — a webview on `tauri://localhost` can
# fetch nothing from disk without it.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
notify-debouncer-full = "0.3"
# Gitignore-aware directory walking (the crate behind ripgrep). Replaces the
# hand-rolled recursive scan, which skipped only dotfiles — so a workspace that
# happened to be a code repo pulled every README in node_modules into memory.
ignore = "0.4"
tauri-plugin-process = "2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
